<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMS Uvaise</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#70c5ce;
  font-family: Arial, sans-serif;
}
canvas{display:block;}

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#overlay img{
  width:140px;
  height:140px;
  border-radius:12px;
  margin-bottom:15px;
}

#title{
  font-size:38px;
  font-weight:bold;
}

#info{
  margin-top:10px;
  font-size:18px;
}

#btn{
  margin-top:20px;
  padding:14px 30px;
  background:#2ecc71;
  border-radius:12px;
  font-size:22px;
}
</style>
</head>
<body>

<div id="overlay">
  <img id="bigBird" src="">
  <div id="title">GEMS Uvaise</div>
  <div id="info">Tap to Play</div>
  <div id="btn">START</div>
</div>

<canvas id="game"></canvas>

<script>
// ===== CANVAS =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// ===== AUDIO (BROWSER SOUND) =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq,dur){
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value=freq;
  g.gain.value=0.1;
  o.start(); o.stop(audioCtx.currentTime+dur);
}

// ===== IMAGE =====
const birdImg = new Image();
birdImg.src = "https://i.ibb.co/dwDN1r14/bird.jpg";
document.getElementById("bigBird").src = birdImg.src;

// ===== GAME STATE =====
let playing=false;
let frame=0;
let score=0;
let highScore=localStorage.getItem("highscore")||0;

// ===== BIRD =====
let bird={
  x:80,
  y:canvas.height/2,
  w:55,   // 🔥 ZOOMED BIRD
  h:55,
  gravity:0.5,
  lift:-8,
  velocity:0
};

// ===== PIPES =====
let pipes=[];

// ===== START / RESTART =====
const overlay=document.getElementById("overlay");
document.getElementById("btn").onclick=()=>{
  audioCtx.resume();
  startGame();
};

function startGame(){
  playing=true;
  frame=0;
  score=0;
  bird.y=canvas.height/2;
  bird.velocity=0;
  pipes=[];
  overlay.style.display="none";
}

// ===== CONTROL =====
document.addEventListener("touchstart",()=>{
  if(!playing) return;
  bird.velocity=bird.lift;
  playSound(600,0.1);
});

// ===== PIPE =====
function addPipe(){
  let gap=160;
  let top=Math.random()*(canvas.height-gap-120)+60;
  pipes.push({
    x:canvas.width,
    top:top,
    bottom:top+gap,
    w:60,
    passed:false
  });
}

// ===== UPDATE =====
function update(){
  if(!playing) return;

  frame++;
  bird.velocity+=bird.gravity;
  bird.y+=bird.velocity;

  if(frame%120===0) addPipe();

  pipes.forEach(p=>{
    p.x-=3;

    if(
      bird.x < p.x+p.w &&
      bird.x+bird.w > p.x &&
      (bird.y < p.top || bird.y+bird.h > p.bottom)
    ){
      endGame();
    }

    if(!p.passed && p.x+p.w < bird.x){
      score++;
      p.passed=true;
      playSound(900,0.1);
    }
  });

  pipes=pipes.filter(p=>p.x+p.w>0);

  if(bird.y<0 || bird.y+bird.h>canvas.height){
    endGame();
  }
}

// ===== GAME OVER =====
function endGame(){
  playSound(200,0.3);
  playing=false;

  if(score>highScore){
    highScore=score;
    localStorage.setItem("highscore",highScore);
  }

  overlay.style.display="flex";
  document.getElementById("info").innerHTML=
    "Score: "+score+"<br>High Score: "+highScore;
  document.getElementById("btn").innerText="RESTART";
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.drawImage(birdImg,bird.x,bird.y,bird.w,bird.h);

  ctx.fillStyle="#2ecc71";
  pipes.forEach(p=>{
    ctx.fillRect(p.x,0,p.w,p.top);
    ctx.fillRect(p.x,p.bottom,p.w,canvas.height);
  });

  ctx.fillStyle="#000";
  ctx.font="bold 32px Arial";
  ctx.fillText(score,canvas.width/2,50);
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
